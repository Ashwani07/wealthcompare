<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page Not Found | WealthCompare</title>

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="/assets/css/site.css?v=6" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at top, var(--bg-grad-start) 0, var(--bg-grad-mid) 40%, var(--bg-grad-end) 100%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
}
a { text-decoration: none; color: inherit; }
.not-found {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.not-found-card {
    max-width: 480px;
    width: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 36px 28px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}
.not-found-card .code {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--brand-teal);
    text-transform: uppercase;
    margin-bottom: 10px;
}
.not-found-card h1 { margin: 0 0 10px; font-size: 24px; }
.not-found-card p { margin: 0 0 22px; color: var(--text-muted); font-size: 14px; }
.not-found-card .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}
.not-found-card .actions a {
    padding: 10px 20px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
}
.not-found-card .primary {
    background: linear-gradient(135deg, #3b82f6, #4f46e5);
    color: white;
}
.not-found-card .secondary {
    background: var(--surface-muted);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
}
</style>
</head>

<body>

<header class="site-header">
    <a class="brand" href="/" aria-label="WealthCompare home">
        <img src="/assets/logo.svg" alt="">
        <span class="brand-name">Wealth<span>Compare</span></span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/#tools">Tools</a>
    </nav>
</header>

<div class="not-found">
    <div class="not-found-card">
        <div class="code">404</div>
        <h1>We couldn't find that page</h1>
        <p>The calculator or article you're looking for may have moved, or the link may be out of date.</p>
        <div class="actions">
            <a class="primary" href="/">Go to homepage</a>
            <a class="secondary" href="/#tools">Browse calculators</a>
        </div>
    </div>
</div>

</body>
</html>
