<div class="container">

    <div class="card">
        <h2 style="background:linear-gradient(135deg,#4f46e5,#3b82f6);color:white;padding:10px;border-radius:10px;">

            </div>
            <div class="input-group">
                <label>Interest Rate (% per year)</label>
                <small>Annual interest rate.</small>
                <input id="interestRate" type="number" min="0" step="0.01" value="8.5">
            </div>
            <div class="input-group">
                <label>Tenure (years)</label>
                <small>Loan duration in years.</small>
                <input id="tenureYears" type="number" min="1" step="1" value="20">
            </div>
        </div>

        <button type="button" onclick="calculateEMI()">Calculate EMI</button>
        <button type="button" class="export-button" onclick="exportEMI()">Export to Excel</button>

    <!-- Results + Explanation -->

            <div id="analysis" class="results-column"></div>
        </div>

    <!-- Placement 4: Below Results Card (acts like below chart for this tool) -->

             style="display:block"

<script>
function formatINR(x) {
    return Number(x.toFixed(2)).toLocaleString('en-IN');
}

function calculateEMI() {
    let loanAmount = +document.getElementById("loanAmount").value;
    let interestRate = +document.getElementById("interestRate").value;
    let tenureYears = +document.getElementById("tenureYears").value;

    let monthlyRate = interestRate / 1200;
    let tenureMonths = tenureYears * 12;

    // EMI formula
        let emi = monthlyRate === 0
                ? loanAmount / tenureMonths
                : loanAmount * monthlyRate * Math.pow(1 + monthlyRate, tenureMonths) /
                    (Math.pow(1 + monthlyRate, tenureMonths) - 1);

    let totalPayment = emi * tenureMonths;
    let totalInterest = totalPayment - loanAmount;

    document.getElementById("results").innerHTML = `
          <div class="result-section">
                <h3>📊 EMI Summary</h3>
                <div class="final-result"><span class="metric-label">Monthly EMI</span><span class="metric-value">₹${formatINR(emi)}</span></div>
                <div class="metric-grid">
                     <div class="metric"><span class="metric-label">Total interest payable</span><span class="metric-value">₹${formatINR(totalInterest)}</span></div>
                     <div class="metric"><span class="metric-label">Total amount payable</span><span class="metric-value">₹${formatINR(totalPayment)}</span></div>
                </div>
          </div>

        <!-- Placement 2: Between EMI Summary & Extra Info -->
        <div style="margin:20px 0;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="200000002"
                 data-ad-format="fluid"
                 data-ad-layout="in-article"
                 data-full-width-responsive="true"></ins>
        </div>

        <hr>

        <div class="result-section">
            <h3>📌 Loan Details</h3>
            <div class="metric-grid">
                <div class="metric"><span class="metric-label">Loan amount</span><span class="metric-value">₹${formatINR(loanAmount)}</span></div>
                <div class="metric"><span class="metric-label">Interest rate</span><span class="metric-value">${interestRate.toFixed(2)}% per year</span></div>
                <div class="metric"><span class="metric-label">Tenure</span><span class="metric-value">${tenureYears} years</span></div>
            </div>
        </div>
    `;

    document.getElementById("analysis").innerHTML = `
        <h3>⚖️ Understanding Your EMI</h3>
        <p><b>EMI (Equated Monthly Instalment)</b> is the fixed amount you pay every month to repay your loan.</p>
        <p>It includes both <b>interest</b> and <b>principal</b>. In the early years, most of your EMI goes towards interest; later, more goes towards principal.</p>
        <p><b>Total Interest</b> shows how much extra you pay over the loan amount because of interest.</p>
        <p><b>Total Amount Payable</b> is the sum of your loan amount and total interest — the actual rupee outflow over the full tenure.</p>

        <!-- Placement 3: Inside Explanation -->
        <div style="margin:20px 0;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="200000003"
                 data-ad-format="fluid"
                 data-ad-layout="in-article"
                 data-full-width-responsive="true"></ins>
        </div>

        <h3>💡 Tips</h3>
        <p>Reducing tenure or interest rate can significantly lower your total interest cost.</p>
        <p>Use this EMI as a base to compare different banks, offers, and prepayment strategies.</p>
    `;
}

function exportEMI() {
    const loanAmount = +document.getElementById("loanAmount").value;
    const interestRate = +document.getElementById("interestRate").value;
    const tenureYears = +document.getElementById("tenureYears").value;
    const months = tenureYears * 12;
    const monthlyRate = interestRate / 1200;
    const emi = monthlyRate === 0 ? loanAmount / months : loanAmount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
    const totalPayment = emi * months;

    exportWorkbook("emi-calculator.xlsx", {
        Inputs: [["EMI Calculator Inputs"], ["Input", "Value"], ["Loan amount", loanAmount], ["Interest rate", interestRate + "% per year"], ["Tenure", tenureYears + " years"]],
        Results: [["EMI Calculator Results"], ["Metric", "Value"], ["Monthly EMI", emi], ["Total interest payable", totalPayment - loanAmount], ["Total amount payable", totalPayment]],
        Analysis: [["Understanding Your EMI"], ["EMI", "The fixed amount paid every month to repay the loan."], ["Interest and principal", "Each EMI includes both interest and principal. Earlier payments generally contain more interest."], ["Total interest", "The extra amount paid over the borrowed loan amount."], ["Total amount payable", "The loan amount plus total interest over the full tenure."], ["Tip", "Reducing tenure or interest rate can lower total interest cost."]]
    });
}

calculateEMI();
bindAmountInWords("loanAmount", "loanAmountWords");
</script>
